<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ScaniMarts | Reset your password</title>
  <link rel="icon" type="image/png" href="../assets/scanimart-favicon.png">
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
  <main class="login-container auth-recovery-shell">
    <section class="login-left"><div class="brand"><div class="logo"><img src="../assets/scanimart-logo.png" alt="ScaniMarts logo"></div><h1>ScaniMarts</h1><p>A simpler way to shop.</p></div></section>
    <section class="login-right"><div class="login-card"><a class="back-link" href="login.html">← Back to sign in</a><h2>Reset your password</h2><p>Enter your email address and we will help you regain access to your account.</p><form id="resetForm" novalidate><div class="form-group"><label for="resetEmail">Email address</label><div class="input-box"><i class="fa-regular fa-envelope"></i><input id="resetEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div></div><button class="login-btn" type="submit">Send reset instructions <i class="fa-solid fa-arrow-right"></i></button><p id="resetStatus" class="form-status" role="status" aria-live="polite"></p></form><p class="bottom-text"><a href="signup.html">Create a ScaniMarts account</a></p></div></section>
  </main>
  <script src="../js/api.js"></script><script>
  document.getElementById('resetForm').addEventListener('submit', async event => { event.preventDefault(); const form=event.currentTarget, email=form.elements.email.value.trim(), status=document.getElementById('resetStatus'), button=form.querySelector('button'); if(!form.checkValidity()){form.reportValidity();return} button.disabled=true; status.className='form-status'; status.textContent='Sending…'; try { await window.API.contact({name:'Password reset request',email, message:'Please help this customer regain access to their ScaniMarts account.'}); status.className='form-status success'; status.textContent='Your request has been received. Our support team will help you regain access.'; form.reset(); } catch(error) { status.className='form-status error'; status.textContent=error.message||'We could not send your request. Please try again.'; } finally { button.disabled=false; } });
  </script>
</body>
</html>
