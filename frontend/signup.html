<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Start your Scanimart trial</title><meta name="description" content="Create your Scanimart inventory management account.">
<link rel="icon" type="image/png" href="/assets/scanimart-favicon.png"><link rel="stylesheet" href="../css/login.css"><link rel="stylesheet" href="../css/signup.css">
</head>
<body><main class="signup-shell"><section class="signup-intro"><a class="signup-logo" href="index.html#home"><img src="../assets/scanimart-logo.png" alt="Scanimart logo"><strong>Scanimart</strong></a><span class="eyebrow">Free trial</span><h1>Get your store under control.</h1><p>Set up inventory, billing and reports in one workspace.</p><ul><li>✓ GST-ready invoices</li><li>✓ Stock alerts and reports</li><li>✓ No credit card required</li></ul></section><section class="signup-card"><a class="back-link" href="index.html#pricing">← Back to pricing</a><h2>Create your account</h2><p id="planNote">Start with a free trial.</p><form id="signupForm" novalidate><label>Full name<input name="name" type="text" autocomplete="name" required minlength="2" placeholder="Your name"></label><label>Work email<input name="email" type="email" autocomplete="email" required placeholder="you@business.com"></label><label>Phone <span>(optional)</span><input name="phone" type="tel" autocomplete="tel" placeholder="+91"></label><label>Password<input name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters"></label><input type="hidden" name="plan" id="plan"><button class="signup-button" type="submit">Create account →</button><p class="form-status" id="signupStatus" role="alert" aria-live="polite"></p></form><p class="signin-note">Already have an account? <a href="login.html">Sign in</a></p></section></main>
<script src="../js/api.js"></script><script src="../js/auth.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{const params=new URLSearchParams(location.search),allowed=['starter','professional','enterprise'],plan=allowed.includes(params.get('plan'))?params.get('plan'):'starter';document.querySelector('#plan').value=plan;document.querySelector('#planNote').textContent='You selected the '+plan.charAt(0).toUpperCase()+plan.slice(1)+' plan. Start free and upgrade when ready.';const form=document.querySelector('#signupForm'),status=document.querySelector('#signupStatus'),button=form.querySelector('button');form.addEventListener('submit',async event=>{event.preventDefault();if(!form.checkValidity()){form.reportValidity();return}button.disabled=true;status.textContent='Creating your account…';try{const session=await window.API.authRegister(Object.fromEntries(new FormData(form).entries()));window.AppAuth.saveSession({user:session.name,email:session.email,uid:session.role,role:String(session.role).toLowerCase()});location.href='dashboard.html'}catch(error){status.className='form-status error';status.textContent=error.message||'Could not create your account.';button.disabled=false}})});
</script></body></html>
